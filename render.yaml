services:
  - type: web
    name: hudu
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hudu-db
          property: connectionString

databases:
  - name: hudu-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
